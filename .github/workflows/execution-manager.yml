name: Execution manager

'on':
  push:
    paths:
      - 'servers/execution/manager/**'
      - 'developer/execution-manager.dockerfile'
      - '.github/workflows/execution-manager.yml'
  pull_request:
    paths:
      - 'servers/execution/manager/**'
      - 'developer/execution-manager.dockerfile'
      - '.github/workflows/execution-manager.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  EXECUTION_MANAGER_PORT: 4004
  EXECUTION_MANAGER_TLS: false

permissions:
  contents: read

jobs:
  test-execution-manager:
    permissions:
      contents: read
    name: Test execution manager
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: servers/execution/manager

    steps:
      - name: Checkout
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup node
        # v6.1.0
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Run linting and formatting checks
        run: |
          YARN_ENABLE_SCRIPTS=false yarn install --frozen-lockfile --ignore-scripts
          yarn syntax:check
          yarn format:check

      - name: Build the execution manager
        run: |
          yarn build

      - name: Run tests
        run: |
          yarn test

      - name: Upload test coverage to Codecov
        # v5.5.2
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: servers/execution/manager/coverage/clover.xml
          flags: execution-manager-tests

      - name: Check execution manager health
        env:
          NODE_NO_WARNINGS: '1'
          NODE_OPTIONS: >-
            --es-module-specifier-resolution=node
            --experimental-specifier-resolution=node
          PORT: ${{ env.EXECUTION_MANAGER_PORT }}
        run: |
          yarn build
          node dist/src/main.js > execution-manager.log 2>&1 &
          manager_pid="$!"
          trap 'kill "$manager_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4; do
            if curl -f -LI "http://localhost:${PORT}/health"; then
              exit 0
            fi
            if ! kill -0 "$manager_pid" 2>/dev/null; then
              cat execution-manager.log
              exit 1
            fi
            sleep 10
          done
          cat execution-manager.log
          exit 1

      - name: Build and check execution manager Docker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            --file developer/execution-manager.dockerfile \
            --tag dtaas-execution-manager:ci \
            .
          container_id=$(docker run --detach --rm \
            --publish 127.0.0.1:4004:4004 \
            dtaas-execution-manager:ci)
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4004/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1
